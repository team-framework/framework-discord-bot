services:
  discord-bot:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment:
      DELIVERY_STATE_PATH: /app/runtime/deliveries.json
    ports:
      - "127.0.0.1:3008:3008"
    volumes:
      - ../runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
