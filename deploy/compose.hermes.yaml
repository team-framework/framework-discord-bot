# Linux host: the bridge listens only on loopback and owns Hermes authentication.
services:
  gateway:
    network_mode: host
    env_file:
      - ../.env.hermes
    environment:
      THREAD_SUMMARY_PROVIDER: hermes
      HERMES_SUMMARY_URL: http://127.0.0.1:8646/v1/responses
    volumes:
      - ${WIKI_GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/home/chaeyn/apps/framework-agent-harness-sync/private-key.pem}:/run/secrets/wiki-app.pem:ro
